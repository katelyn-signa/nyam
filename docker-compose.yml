version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: courtlens-db
    environment:
      POSTGRES_DB: courtlens_db
      POSTGRES_USER: courtlens_user
      POSTGRES_PASSWORD: courtlens_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtlens_user -d courtlens_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: courtlens-api
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://courtlens_user:courtlens_secret@database:5432/courtlens_db
      JWT_SECRET: courtlens-super-secret-cryptographic-signing-key-2026
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      STORAGE_TYPE: local
      UPLOAD_DIR: uploads
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: courtlens-web
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
